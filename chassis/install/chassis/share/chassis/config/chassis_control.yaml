controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "FL_Joint"
    front_right_wheel_command_joint_name: "FR_Joint"
    rear_left_wheel_command_joint_name: "BL_Joint"
    rear_right_wheel_command_joint_name: "BR_Joint"
    kinematics:
      wheels_radius: 0.0375
      sum_of_robot_center_projection_on_x_axis: 0.4166
      sum_of_robot_center_projection_on_y_axis: 0.1550
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    publish_rate: 50.0
    open_loop: false
    enable_odom_tf: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.y.max_velocity: 1.0
    linear.y.min_velocity: -1.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    cmd_vel_timeout: 0.5