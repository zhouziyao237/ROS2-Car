# 里程计参数（用于 unified_odometry 节点）
odometry:
  ros__parameters:
    use_sim: true          # 仿真为 true，实车改为 false
    wheel_radius: 0.0375
    wheel_base: 0.1550
    track_width: 0.4166
    odom_frame: "odom"
    base_frame: "base_link"
    publish_rate: 50.0

# 麦轮驱动插件参数（用于自定义 Gazebo 插件）
mecanum_drive_plugin:
  ros__parameters:
    wheel_radius: 0.0375
    wheel_base: 0.1550
    track_width: 0.4166
    fl_joint: "FL_Joint"
    fr_joint: "FR_Joint"
    bl_joint: "BL_Joint"
    br_joint: "BR_Joint"
    fl_dir: -1.0
    fr_dir: 1.0
    bl_dir: -1.0
    br_dir: 1.0
