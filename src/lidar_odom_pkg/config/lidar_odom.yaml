scan_match_odom:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    odom_frame: odom
    base_frame: base_link
    rate_hint_hz: 12.0
    min_range: 0.08
    max_range: 20.0
    max_points: 180
    icp_iterations: 8
    max_corr_dist: 0.45
    downsample_step: 6
    publish_tf: true
    publish_debug_pose: false
