# Semantic shelf front geometry override
# L / layer_qr is mounted on the FRONT face of the shelf.
# The shelf footprint should be placed like the red rectangle in RViz.
# If the shelf rotates to the opposite side, change -90.0 to 90.0.

semantic_registrar_node:
  ros__parameters:
    front_yaw_offset_deg: -90.0
    shelf_yaw_offset_deg: -90.0
    shelf_front_yaw_offset_deg: -90.0
    layer_qr_yaw_offset_deg: -90.0
    front_layer_qr_yaw_offset_deg: -90.0
    footprint_yaw_offset_deg: -90.0
    marker_yaw_offset_deg: -90.0
    semantic_shelf_yaw_offset_deg: -90.0

apriltag_shelf_bridge_node:
  ros__parameters:
    front_yaw_offset_deg: -90.0
    shelf_yaw_offset_deg: -90.0
    shelf_front_yaw_offset_deg: -90.0
    layer_qr_yaw_offset_deg: -90.0
    front_layer_qr_yaw_offset_deg: -90.0
    footprint_yaw_offset_deg: -90.0
    marker_yaw_offset_deg: -90.0
    semantic_shelf_yaw_offset_deg: -90.0
