qr_lift_control_node:
  ros__parameters:
    target_pose_topic: /target_pose_base
    platform_target_topic: /platform/target
    platform_target_type: auto_aim_interfaces/msg/PlatformTarget
    lift_field: target_lift_z_mm
    slide_field: target_slide_x_mm
    screw_field: target_screw_x_mm

    platform_min_height_mm: 0.0
    platform_max_height_mm: 280.0
    initial_lift_target_mm: 0.0

    z_target_mm: 0.0
    kp_z: 0.08
    max_step_mm: 1.0
    deadband_mm: 30.0
    release_deadband_mm: 45.0
    hold_required_frames: 5
    lift_direction: 1.0

    valid_abs_z_max_mm: 900.0
    valid_abs_y_max_mm: 900.0
    max_jump_z_mm: 900.0

    filter_window: 7
    stable_required: 3
    lost_timeout_sec: 0.5
    return_home_step_mm: 4.0

    slide_hold_mm: 0.0
    screw_hold_mm: 0.0

qr_chassis_align_node:
  ros__parameters:
    target_pose_topic: /target_pose_base
    nav_cmd_topic: /cmd_vel
    output_cmd_topic: /cmd_vel_selected

    enable_topic: /qr_chassis_align/enable
    debug_topic: /qr_chassis_align/debug

    enable_align_on_start: false
    lost_behavior: zero

    control_rate_hz: 30.0
    target_timeout_sec: 0.4
    nav_timeout_sec: 0.5

    control_axis: x
    vy_direction: -1.0
    kp_vy: 0.00015
    max_vy: 0.08
    deadband_mm: 45.0

    filter_window: 5
    max_jump_mm: 500.0

    keep_nav_vx: false
    keep_nav_wz: false
    fixed_vx_when_align: 0.0
    fixed_wz_when_align: 0.0
