model:
  # 必须指向真实存在的 blob 文件；如果你还没有 new blob，就先用 best_fp16.blob
  blob_path: /host-home/src/target_detection/oak_vision_driver/weights/best_fp16.blob
  parser: NeuralNetwork
  network_type: yolov5

camera:
  # 相机传感器采集分辨率，不是神经网络输入尺寸
  sensor_resolution: 1080p

  # preview: ROS 图像发布 640x640
  # video: ROS 图像发布 1920x1080，适合 QR 远距离识别
  # 现在你要远距离识别 QR，所以改成 video
  rgb_output: video

  # YOLO NN 输入来自 preview，必须和 input.width/input.height 一致
  # 即使 rgb_output=video，也保留 preview 作为 NN 输入配置
  preview_width: 640
  preview_height: 640

  # rgb_output: video 时，ROS /oak/rgb/image_raw 使用这个尺寸
  video_width: 1920
  video_height: 1080

  # 给 YOLO 的图像通道。一般保持 RGB
  color_order: RGB

  # 先保持 false，避免 letterbox/padding 坐标复杂
  keep_aspect_ratio: false

input:
  # 网络输入尺寸，必须和 blob 导出尺寸一致
  width: 640
  height: 640
  fps: 6.0

classes:
  num_classes: 1
  names:
    - target

threshold:
  # 如果没框降到 0.05；如果误检多升到 0.12/0.15
  confidence: 0.14

  # NMS 去重建议 0.35~0.45，不要用 0.65/0.8
  iou: 0.25

yolo:
  coordinate_size: 4
  score_mode: obj_cls
  output_value_mode: auto

  anchors:
    - 10
    - 13
    - 16
    - 30
    - 33
    - 23
    - 30
    - 61
    - 62
    - 45
    - 59
    - 119
    - 116
    - 90
    - 156
    - 198
    - 373
    - 326

  anchor_masks:
    side80:
      - 0
      - 1
      - 2
    side40:
      - 3
      - 4
      - 5
    side20:
      - 6
      - 7
      - 8

ros:
  frame_id: oak_camera_link

  # 这个 topic 现在会发布 1920x1080
  rgb_topic: /oak/rgb/image_raw

  depth_topic: /oak/depth/image_raw
  camera_info_topic: /oak/rgb/camera_info
  detections_topic: /yolov5/detections
  yolo_debug_topic: /oak/yolo_debug_text
  annotated_image_topic: /oak/yolo_annotated_image
  yolo_table_topic: /oak/yolo_table

runtime:
  enable_rgb: true
  enable_depth: true

  # 你现在是 QR 识别，不需要 OAK YOLO，保持 false
  enable_yolo: false

  # enable_yolo=false 时这些影响不大，但可以关掉减少负载
  draw_oak_detections_on_rgb: false
  publish_annotated_image: false
  publish_debug_text: false
  publish_yolo_table: false

  # 如果画面颜色异常，可以改 rgb8 试
  ros_image_encoding: bgr8

  debug_scores: false
  score_log_interval: 60

  # 关键：1920x1080 尽量不要 USB2
  # 需要 USB3 线 + USB3 口
  force_usb2: false

  stop_on_xlink_error: true
  queue_size: 1
  timer_period: 0.02