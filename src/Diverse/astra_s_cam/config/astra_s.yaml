astra_s_driver_node:
  ros__parameters:
    camera_name: "Astra_Orbbec"

    rgb_topic: "/camera/rgb/image_raw"
    depth_topic: "/camera/depth/image_raw"
    rgb_camera_info_topic: "/camera/rgb/camera_info"
    depth_camera_info_topic: "/camera/depth/camera_info"

    camera_link_frame: "camera_link"
    rgb_frame: "camera_rgb_optical_frame"
    depth_frame: "camera_depth_optical_frame"

    enable_rgb: true
    enable_depth: true

    rgb_width: 640
    rgb_height: 480
    rgb_fps: 30

    depth_width: 640
    depth_height: 480
    depth_fps: 30

    # Default fallback intrinsics. Replace after RGB calibration if needed.
    fx: 570.342
    fy: 570.342
    cx: 319.5
    cy: 239.5

    depth_fx: 570.342
    depth_fy: 570.342
    depth_cx: 319.5
    depth_cy: 239.5

    publish_rate_hz: 30.0

rgbd_locator_node:
  ros__parameters:
    rgb_topic: "/camera/rgb/image_raw"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/rgb/camera_info"

    target_pixel_topic: "/astra_s_cam/target_pixel"
    target_position_topic: "/astra_s_cam/target_position_mm"
    target_point_topic: "/astra_s_cam/target_point"
    debug_image_topic: "/astra_s_cam/debug_image"

    camera_frame: "camera_rgb_optical_frame"

    depth_unit: "mm"
    min_depth_mm: 150.0
    max_depth_mm: 5000.0
    sample_radius: 3

    # During testing, true means it will use image center if no target pixel is received.
    # For real detector integration, set false.
    use_center_when_no_target: false
    publish_debug_image: true

    depth_scale_correction: 1.0
    depth_offset_mm: 0.0

    # RGB pixel to depth pixel mapping. Adjust after RGB-depth alignment verification.
    rgb_to_depth_offset_u: 0.0
    rgb_to_depth_offset_v: 0.0
    rgb_to_depth_scale_u: 1.0
    rgb_to_depth_scale_v: 1.0

depth_calib_node:
  ros__parameters:
    depth_topic: "/camera/depth/image_raw"
    sample_radius: 10
    min_depth_mm: 150.0
    max_depth_mm: 5000.0
