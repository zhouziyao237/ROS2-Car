model:
  # 必须指向真实存在的 blob 文件；如果你还没有 new blob，就先用 best_fp16.blob
  blob_path: /host-home/src/target_detection/oak_vision_driver/weights/best_fp16.blob
  parser: NeuralNetwork
  network_type: yolov5

camera:
  # 相机传感器采集分辨率，不是神经网络输入尺寸
  sensor_resolution: 1080p

  # preview: ROS 图像和 YOLO 都使用 640x640，框不会错位，推荐用于抓取控制
  # video: ROS 图像发布 1920x1080，但 YOLO 仍用 640x640，需要坐标映射
  rgb_output: preview

  # YOLO NN 输入来自 preview，必须和 input.width/input.height 一致
  preview_width: 640
  preview_height: 640

  # 只有 rgb_output: video 时才使用
  video_width: 1920
  video_height: 1080

  # 给 YOLO 的图像通道。一般保持 RGB
  color_order: RGB

  # 先保持 false，避免 letterbox/padding 坐标复杂
  keep_aspect_ratio: false

input:
  # 网络输入尺寸，必须和 blob 导出尺寸一致
  width: 640
  height: 640
  fps: 6.0

classes:
  num_classes: 1
  names:
    - target

threshold:
  # 如果没框降到 0.05；如果误检多升到 0.12/0.15
  confidence: 0.14
  # NMS 去重建议 0.35~0.45，不要用 0.65/0.8
  iou: 0.25

yolo:
  coordinate_size: 4
  score_mode: obj_cls
  output_value_mode: auto

  anchors:
    - 10
    - 13
    - 16
    - 30
    - 33
    - 23
    - 30
    - 61
    - 62
    - 45
    - 59
    - 119
    - 116
    - 90
    - 156
    - 198
    - 373
    - 326

  anchor_masks:
    side80:
      - 0
      - 1
      - 2
    side40:
      - 3
      - 4
      - 5
    side20:
      - 6
      - 7
      - 8

ros:
  frame_id: oak_rgb_camera_optical_frame
  rgb_topic: /oak/rgb/image_raw
  depth_topic: /oak/depth/image_raw
  camera_info_topic: /oak/rgb/camera_info
  detections_topic: /yolov5/detections
  yolo_debug_topic: /oak/yolo_debug_text
  annotated_image_topic: /oak/yolo_annotated_image
  yolo_table_topic: /oak/yolo_table

runtime:
  enable_rgb: true
  enable_depth: true
  enable_yolo: false

  draw_oak_detections_on_rgb: true
  publish_annotated_image: true
  publish_debug_text: true
  publish_yolo_table: true

  # 如果画面偏蓝，改成 rgb8 再试
  ros_image_encoding: bgr8

  debug_scores: false
  score_log_interval: 60

  force_usb2: true
  stop_on_xlink_error: true
  queue_size: 1
  timer_period: 0.02
