target_position_overlay_node:
  ros__parameters:
    image_topic: /oak/rgb/image_raw
    depth_topic: /oak/depth/image_raw
    camera_info_topic: /oak/rgb/camera_info
    detections_topic: /target_matcher/matched_detection

    target_pose_topic: /target_pose_base
    target_pose_3d_topic: /target_pose_3d
    overlay_image_topic: /target_position_overlay/image
    debug_topic: /target_position_overlay/debug

    target_frame: oak_camera_link

    depth_window_px: 7
    min_depth_mm: 50.0
    max_depth_mm: 5000.0

    # RGB=1920x1080，depth 低分辨率时必须 true
    scale_rgb_to_depth: true

    # 远距离轻量深度采样
    use_grid_points: true
    grid_rows: 2
    grid_cols: 2
    corner_inset_ratio: 0.20

    depth_consistency_max_diff_mm: 180.0
    min_valid_depth_points: 2

    # 远距离实时模式先关角度估计
    enable_plane_angle_estimation: false
    min_valid_corner_points: 3

    draw_overlay: true
    draw_sample_points: false
    draw_camera_center: true
    draw_image_center_line: true
    draw_alignment_target: true
    draw_alignment_lines: true
    draw_size_info: false

    # x=左右，y=升降，z=深度
    align_target_x_mm: 0.0
    align_target_y_mm: 0.0

    publish_rate_hz: 10.0
    verbose: false