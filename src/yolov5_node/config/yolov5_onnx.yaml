yolov5_onnx_node:
  ros__parameters:
    model_path: "$(find-pkg-share yolov5_node)/weights/best_int8.onnx"
    # topic / image / auto
    input_mode: "topic"

    # topic 模式使用
    image_topic: "/image_raw"

    # image 模式使用
    image_path: ""
    save_path: "/mnt/yolov5/result.jpg"
    exit_after_image: true

    detections_topic: "/yolov5/detections"
    annotated_topic: "/yolov5/annotated_image"

    img_size: 640
    conf_thres: 0.80
    iou_thres: 0.5
    num_threads: 1

    class_names:
      - "target"

    anchors:
      - 10.0
      - 13.0
      - 16.0
      - 30.0
      - 33.0
      - 23.0

      - 30.0
      - 61.0
      - 62.0
      - 45.0
      - 59.0
      - 119.0

      - 116.0
      - 90.0
      - 156.0
      - 198.0
      - 373.0
      - 326.0
