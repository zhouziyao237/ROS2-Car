parcel_pickup_mission_node:
  ros__parameters:
    # single_oak:
    #   OAK 同时搜索和精定位
    # usb_wide_oak_pick:
    #   USB 广角搜索，OAK 精定位
    camera_mode: usb_wide_oak_pick
    mirror_pick_target_during_search: true

    pickup_code_topic: /mission/pickup_code
    mission_state_topic: /mission/state
    mission_debug_topic: /mission/debug

    wide_target_code_topic: /wide_target_code
    wide_qr_state_topic: /wide_qr/state
    wide_qr_raw_topic: /wide_qr/raw
    wide_center_error_topic: /wide_qr/center_error_x

    pick_target_code_topic: /target_code
    pick_qr_state_topic: /target_matcher/state
    pick_qr_raw_topic: /target_matcher/raw
    pick_target_pose_topic: /target_pose_base

    set_lift_topic: /qr_lift_control/set_lift_mm
    chassis_align_enable_topic: /qr_chassis_align/enable
    lift_enable_topic: /qr_lift_control/enable
    lift_freeze_topic: /qr_lift_control/freeze
    pickup_extend_start_topic: /pickup_extend/start
    pickup_extend_retract_topic: /pickup_extend/retract

    cmd_vel_topic: /cmd_vel_selected

    shelf_col_prefix: 'COL:'
    shelf_row_prefix: 'ROW:'

    row_ids: ['1', '2', '3', '4']
    row_heights_mm: [60.0, 150.0, 240.0, 330.0]
    base_height_mm: 60.0
    level_gap_mm: 90.0
    row_height_wait_sec: 2.0

    # 沿货架边缘移动方向
    # 麦轮横移一般用 y
    # 如果你的车沿货架走是前进方向，就改 x
    edge_axis: 'y'

    # 如果沿边方向反了，改成 -1.0
    edge_direction: 1.0

    # 沿货架搜索速度
    edge_search_speed_mps: 0.04

    # 广角找到包裹后，让目标进入 OAK 视野的速度
    edge_to_oak_speed_mps: 0.025

    # 广角中心误差小于这个值，认为大概居中
    wide_center_deadband: 0.15

    # 用广角误差决定往左还是往右微动
    use_wide_error_for_edge_direction: true

    # 如果目标在右边但车往反方向走，改成 -1.0
    wide_error_direction: 1.0

    # 搜索时默认不转
    edge_search_wz: 0.0

    search_col_timeout_sec: 30.0
    search_row_timeout_sec: 30.0
    search_package_timeout_sec: 60.0
    oak_view_timeout_sec: 30.0
    pick_confirm_timeout_sec: 20.0

    # 包裹搜索时，平台在目标层附近上下扫
    package_search_range_mm: 25.0
    package_search_step_mm: 5.0
    package_search_interval_sec: 0.70

    lift_min_mm: 0.0
    lift_max_mm: 350.0

    x_target_mm: 0.0
    y_target_mm: 0.0

    x_deadband_mm: 35.0
    y_deadband_mm: 30.0
    stable_required_frames: 5
    pose_timeout_sec: 0.8

    chassis_align_timeout_sec: 10.0
    lift_align_timeout_sec: 15.0

    extend_wait_sec: 4.0
    retract_wait_sec: 3.0

    # ===== Dynamic anchor search for SLAM + Nav2 =====
    use_anchor_nav_search: true
    nav_action_name: /navigate_to_pose
    nav_frame_id: map
    base_frame_id: base_link

    # 找 COL anchor 时允许短距离低速搜索，但不会无限左走

    require_col_verify: true
    col_verify_timeout_sec: 5.0

    find_col_max_time_sec: 12.0
    find_col_cmd_vx: 0.0
    find_col_cmd_vy: 0.0
    find_col_cmd_wz: 0.0

    # 找到 COL 后，以当前 map->base_link 为 anchor，自动生成 Nav2 搜索点
    anchor_search_axis: lateral
    anchor_search_offsets_m: [0.0, 0.20, -0.20, 0.40, -0.40]
    anchor_yaw_offset_rad: 0.0

    nav_goal_timeout_sec: 45.0
    search_dwell_sec: 3.0
    oak_view_timeout_sec: 10.0

    package_search_enable_lift_scan: true
    package_search_range_mm: 25.0
    package_search_step_mm: 5.0
    package_search_interval_sec: 0.70
    lift_min_mm: 0.0
    lift_max_mm: 350.0


    # ===== Local pickup mode after navigation arrived =====
    require_tf_anchor: false
    require_col_verify: true
    col_verify_timeout_sec: 8.0
    row_verify_timeout_sec: 10.0
    package_search_timeout_sec: 15.0
    oak_view_timeout_sec: 10.0

    package_search_enable_lift_scan: true
    package_search_range_mm: 25.0
    package_search_step_mm: 5.0
    package_search_interval_sec: 0.70
    lift_min_mm: 0.0
    lift_max_mm: 350.0

    state_period_sec: 0.10
