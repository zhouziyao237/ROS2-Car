parcel_pickup_mission_node:
  ros__parameters:
    pickup_code_topic: /mission/pickup_code
    mission_state_topic: /mission/state
    mission_debug_topic: /mission/debug

    target_code_topic: /target_code
    target_matcher_state_topic: /target_matcher/state
    target_matcher_raw_topic: /target_matcher/raw
    target_pose_topic: /target_pose_base

    set_lift_topic: /qr_lift_control/set_lift_mm

    chassis_align_enable_topic: /qr_chassis_align/enable

    lift_enable_topic: /qr_lift_control/enable
    lift_freeze_topic: /qr_lift_control/freeze
    lift_home_topic: /qr_lift_control/home

    pickup_extend_start_topic: /pickup_extend/start
    pickup_extend_retract_topic: /pickup_extend/retract

    # Pickup code: <shelf_col>-<shelf_row>-<package_code>, example: 2-3-1285
    pickup_code_regex: '^([0-9]{1,4})-([0-9]{1,4})-([0-9]{1,4})$'

    shelf_col_prefix: 'COL:'
    shelf_row_prefix: 'ROW:'

    # true: after finding COL:x, also find ROW:y QR.
    # false: skip row QR and use row_heights_mm directly.
    use_row_qr: true

    row_ids: ['1', '2', '3', '4']
    row_heights_mm: [60.0, 150.0, 240.0, 330.0]

    base_height_mm: 60.0
    level_gap_mm: 90.0
    row_height_wait_sec: 2.0

    # /target_pose_base convention:
    # x = horizontal offset, y = lift offset, z = depth distance
    x_target_mm: 0.0
    y_target_mm: 0.0

    x_deadband_mm: 35.0
    y_deadband_mm: 30.0
    stable_required_frames: 5
    pose_timeout_sec: 0.8

    search_shelf_timeout_sec: 20.0
    search_row_timeout_sec: 20.0
    search_package_timeout_sec: 20.0
    chassis_align_timeout_sec: 8.0
    lift_align_timeout_sec: 8.0

    state_period_sec: 0.10
    extend_wait_sec: 4.0
    retract_wait_sec: 3.0
