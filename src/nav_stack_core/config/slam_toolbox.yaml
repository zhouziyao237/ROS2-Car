slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping
    scan_queue_size: 1
    restamp_tf: true
    resolution: 0.05
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    transform_publish_period: 0.02
    map_update_interval: 1.0
    max_laser_range: 25.0
    throttle_scans: 1
    debug_logging: false
