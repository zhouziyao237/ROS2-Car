slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_front

    use_map_saver: true
    debug_logging: false
    use_scan_matching: true
    # Front-only 120 deg scans can make barycenter-based alignment turn pure
    # rotation into false translation. Keep scan matching on, but disable this.
    use_scan_barycenter: false

    throttle_scans: 1
    minimum_time_interval: 0.0
    # Avoid publishing map->odom updates on tiny scan-to-scan jitter.
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.03

    transform_publish_period: 0.02
    map_update_interval: 0.2
    resolution: 0.05
    min_laser_range: 0.2
    max_laser_range: 12.0
    scan_queue_size: 20
    restamp_tf: true
