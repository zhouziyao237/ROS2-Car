oak_vision_driver_node:
  ros__parameters:
    enable_rgb: true
    enable_depth: false

    yolo_backend: oak
    enable_yolo: true

    parser: NeuralNetwork

    rgb_topic: /oak/rgb/image_raw
    depth_topic: /oak/depth/image_raw
    camera_info_topic: /oak/rgb/camera_info
    detections_topic: /yolov5/detections
    yolo_debug_topic: /oak/yolo_debug_text
    annotated_image_topic: /oak/yolo_annotated_image
    yolo_table_topic: /oak/yolo_table

    frame_id: oak_rgb_camera_optical_frame

    rgb_width: 640
    rgb_height: 640

    fps: 6.0
    queue_size: 1
    timer_period: 0.01

    force_usb2: true
    stop_on_xlink_error: true

    blob_path: /host-home/src/oak_vision_driver/weights/best.blob
    network_type: yolov5

    num_classes: 1
    class_names:
      - target

    conf: 0.25
    iou: 0.45
    need_ocr: true

    decoder_debug: false

    draw_oak_detections_on_rgb: true

    anchors:
      - 10.0
      - 13.0
      - 16.0
      - 30.0
      - 33.0
      - 23.0
      - 30.0
      - 61.0
      - 62.0
      - 45.0
      - 59.0
      - 119.0
      - 116.0
      - 90.0
      - 156.0
      - 198.0
      - 373.0
      - 326.0

    anchor_mask_side80: [0, 1, 2]
    anchor_mask_side40: [3, 4, 5]
    anchor_mask_side20: [6, 7, 8]